name: stock-radar

services:
  web:
    build:
      context: .
      args:
        DEBIAN_MIRROR: mirrors.aliyun.com
        PIP_INDEX_URL: https://pypi.tuna.tsinghua.edu.cn/simple
    image: stock-radar:1.0.2
    container_name: stock-radar-web
    restart: unless-stopped
    init: true
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--app-dir", "backend"]
    ports:
      - "18000:8000"
    environment:
      TZ: Asia/Shanghai
      POLL_INTERVAL_SECONDS: "900"
      LOGIN_USERNAME: "${LOGIN_USERNAME:-}"
      LOGIN_PASSWORD: "${LOGIN_PASSWORD:-}"
    volumes:
      - ./data:/app/backend/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  monitor:
    image: stock-radar:1.0.2
    container_name: stock-radar-monitor
    restart: unless-stopped
    init: true
    command: ["python", "-m", "backend.app.monitor_worker"]
    environment:
      TZ: Asia/Shanghai
      POLL_INTERVAL_SECONDS: "900"
    volumes:
      - ./data:/app/backend/data
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  notifier:
    image: stock-radar:1.0.2
    container_name: stock-radar-notifier
    restart: unless-stopped
    init: true
    command: ["python", "-m", "backend.app.notification_worker"]
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./data:/app/backend/data
    depends_on:
      web:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
